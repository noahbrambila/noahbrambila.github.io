    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Rowdies for headings, Inter for sans-serif UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        rowdies: ['"Rowdies"', 'cursive', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: '#13193a',
                        'button-red': '#ee2c3c',
                        'custom-blue': '#004AAD',
                    }
                }
            }
        }
    </script>
    <style>
        /* Fallback subtle gradient overlay to ensure text legibility on different screens */
        .bg-overlay {
            background: linear-gradient(to right, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.3) 40%, transparent 100%);
        }
        @media (min-width: 1024px) {
            .bg-overlay {
                background: linear-gradient(to right, rgba(255, 255, 255, 0.5) 0%, transparent 40%);
            }
        }
    </style>
</head>

<!-- Background image of a professional woman (using a high-quality placeholder) -->
<body class="min-h-screen bg-cover bg-center bg-no-repeat relative text-gray-900 font-sans" 
      style="background-image: url('https://i.imgur.com/Wn2kSLj.png');">
    
    <!-- Optional overlay for text legibility on smaller screens -->
    <div class="absolute inset-0 bg-overlay pointer-events-none"></div>

    <!-- Main Content centered at 25% horizontal position (middle of left half) on desktop -->
    <main class="relative z-10 w-full min-h-screen flex items-center justify-center lg:justify-start px-6">
        
        <div class="flex flex-col items-center text-center w-full max-w-lg lg:absolute lg:left-1/4 lg:-translate-x-1/2">
            
            <!-- Emblem / Seal Placeholder (commented out as requested) -->
            <!-- 
            <div class="mb-5 w-16 h-16 md:w-20 md:h-20 flex items-center justify-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Great_Seal_of_the_United_States_%28obverse%29.svg/1024px-Great_Seal_of_the_United_States_%28obverse%29.svg.png" 
                     alt="Official Seal" 
                     class="w-full h-full object-contain opacity-90 drop-shadow-sm mix-blend-multiply filter grayscale opacity-75">
            </div>
            -->
            
            <!-- "THE OFFICE of" Text -->
            <p class="font-rowdies text-navy font-normal tracking-[0.25em] text-xs sm:text-sm md:text-base mb-2 uppercase">
                The Office <span class="lowercase italic font-light tracking-normal mx-1">of</span>
            </p>

            <!-- Main Heading (Name) -->
            <h1 class="font-rowdies text-navy flex flex-col items-center leading-[1.1]">
                <span class="text-4xl sm:text-5xl md:text-6xl font-bold tracking-wider block">
                    NOAH
                </span>
                <span class="text-5xl sm:text-6xl md:text-7xl font-bold tracking-[0.18em] block mt-1 md:mt-2 ml-2">
                    BRAMBILA
                </span>
            </h1>

            <!-- Call to Action Buttons -->
            <div class="mt-8 md:mt-10 flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="/presidential-office" class="inline-block bg-button-red text-white font-sans font-bold text-sm md:text-base px-6 py-3 md:px-8 md:py-4 rounded-full border-[1.5px] border-black shadow-lg hover:bg-[#c92130] hover:-translate-y-0.5 transition-all duration-200">
                    Presidential Office
                </a>
                <a href="/representatives-office" class="inline-block bg-custom-blue text-white font-sans font-bold text-sm md:text-base px-6 py-3 md:px-8 md:py-4 rounded-full border-[1.5px] border-black shadow-lg hover:bg-[#003c8c] hover:-translate-y-0.5 transition-all duration-200">
                    Representative Office
                </a>
            </div>
            
        </div>
    </main>
