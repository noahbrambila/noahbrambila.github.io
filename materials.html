<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Materials | Noah for Gardening Club</title>
  <style>
    :root {
      --ink: #111111;
      --paper: #ffffff;
      --accent: #d3feff;
      --line: rgba(17, 17, 17, 0.22);
    }

    @font-face {
      font-family: "Union Gothic";
            src: url("union_gothic-variable.ttf") format("truetype");
      font-weight: 1 999;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--accent);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .page-shell h1 {
      font-family: "Union Gothic", Arial, sans-serif;
      font-size: clamp(2rem, 6vw, 4.5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .popup-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(920px, 100%);
      max-height: min(680px, calc(100vh - 2.5rem));
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      transform: translateY(16px) scale(0.98);
      transition: transform 220ms ease;
    }

    .popup-overlay.show .popup-card {
      transform: translateY(0) scale(1);
    }

    .popup-media {
      min-height: 520px;
      background: var(--ink);
    }

    .popup-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .popup-content {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2.25rem, 5vw, 3.5rem);
    }

    .popup-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      font: 300 1.75rem/1 Arial, sans-serif;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .popup-close:hover,
    .popup-close:focus-visible {
      border-color: var(--line);
      background: #f1f1f1;
      outline: none;
    }

    .popup-eyebrow {
      margin: 0 0 1rem;
      color: #4d4d4d;
      font: 700 0.75rem/1.2 Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .popup-content h1 {
      max-width: 15ch;
      margin: 0 0 1rem;
      font: 800 clamp(2rem, 4vw, 3.25rem)/0.98 "Union Gothic", Arial, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .popup-content p {
      max-width: 34rem;
      margin: 0 0 2rem;
      color: #4d4d4d;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .action-grid a {
      display: grid;
      min-height: 3.75rem;
      place-items: center;
      padding: 0.75rem;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      font: 700 0.78rem/1.2 Arial, sans-serif;
      letter-spacing: 0.08em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .action-grid a:last-child {
      background: var(--paper);
      color: var(--ink);
    }

    .action-grid a:hover,
    .action-grid a:focus-visible {
      transform: translateY(-2px);
      background: var(--accent);
      color: var(--ink);
      outline: none;
    }

    @media (max-width: 767px) {
      .popup-overlay {
        padding: 0.75rem;
      }

      .popup-card {
        display: block;
        max-height: calc(100vh - 1.5rem);
        overflow-y: auto;
      }

      .popup-media {
        height: min(42vh, 300px);
        min-height: 0;
      }

      .popup-content {
        min-height: 330px;
        padding: 2rem 1.5rem 1.5rem;
      }

      .popup-content h1 {
        font-size: clamp(1.8rem, 9vw, 2.6rem);
      }

      .popup-content p {
        margin-bottom: 1.5rem;
        font-size: 0.98rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .popup-overlay,
      .popup-card,
      .action-grid a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <h1>Campaign Materials</h1>
  </main>

  <div id="popup-modal" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <div class="popup-card">
      <div class="popup-media">
        <img src="https://thetigertimesfwpa.org/wp-content/uploads/2026/06/110_7157-e1781285375188-1200x800.jpg" alt="Students gathering at school" loading="eager">
      </div>
      <section class="popup-content">
        <button class="popup-close" type="button" aria-label="Close popup">&times;</button>
        <p class="popup-eyebrow">Noah Brambila for President</p>
        <h1 id="popup-title">It's time to thrive.</h1>
        <p>Help build a more connected, creative, and student-led Gardening Club. See the plan and find your way into the campaign.</p>
        <nav class="action-grid" aria-label="Campaign actions">
                    <a href="issues/">View the platform</a>
                    <a href="meetnoah/">Meet Noah</a>
                    <a href="showsupport/">Show support</a>
                    <a href="index.html" data-close-popup>Maybe later</a>
        </nav>
      </section>
    </div>
  </div>

  <script>
    const popup = document.getElementById("popup-modal");
    const closeButton = popup.querySelector(".popup-close");
    const popupSeenKey = "supportPopupLastSeen";
    const today = new Date().toLocaleDateString();

    function closePopup() {
      popup.classList.remove("show");
      document.body.style.overflow = "";
    }

    if (localStorage.getItem(popupSeenKey) !== today) {
      popup.classList.add("show");
      localStorage.setItem(popupSeenKey, today);
      document.body.style.overflow = "hidden";
    }

    closeButton.addEventListener("click", closePopup);
    popup.addEventListener("click", (event) => {
      if (event.target === popup) {
        closePopup();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && popup.classList.contains("show")) {
        closePopup();
      }
    });
  </script>
</body>
</html>
